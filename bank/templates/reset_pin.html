{% extends 'base.html' %}
{% block content %}

<style>
.reset-section{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
}

.reset-card{
    background:white;
    padding:50px 60px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
    width:420px;
}

.reset-card h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.input-box input:focus{
    border-color:#667eea;
    outline:none;
}

.reset-btn{
    width:100%;
    background:#667eea;
    color:white;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.reset-btn:hover{
    background:#5a67d8;
}

.error{
    background:#ffe6e6;
    color:#c0392b;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#e6ffed;
    color:#27ae60;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}
</style>

<div class="reset-section">
    <div class="reset-card">
        <h2>🔐 Reset PIN</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="password" name="old_pin" placeholder="Enter Old PIN" required>
            </div>

            <div class="input-box">
                <input type="password" name="new_pin" placeholder="Enter New PIN" required>
            </div>

            <div class="input-box">
                <input type="password" name="confirm_pin" placeholder="Confirm New PIN" required>
            </div>

            <button type="submit" class="reset-btn">Update PIN</button>
        </form>
    </div>
</div>

{% endblock %}
